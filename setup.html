<style>
:root{
  --ground:#f3f5f8; --card:#ffffff; --ink:#0b1b2b; --muted:#5c6975; --line:#dfe4ea;
  --accent:#1e5eff; --accent-ink:#ffffff; --accent-soft:#e9efff; --good:#12a86f; --good-soft:#e3f5ea; --warn-soft:#fff4e0; --warn-ink:#8a5a00;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0f1419; --card:#171d24; --ink:#e9eef3; --muted:#98a4b1; --line:#2a323c; --accent-soft:#12283f; --good-soft:#0f2a1c; --warn-soft:#2e2410; --warn-ink:#f0c060;
} }
:root[data-theme="dark"]{ --ground:#0f1419; --card:#171d24; --ink:#e9eef3; --muted:#98a4b1; --line:#2a323c; --accent-soft:#12283f; --good-soft:#0f2a1c; --warn-soft:#2e2410; --warn-ink:#f0c060; }
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .pill{background:var(--accent);color:#fff;font-size:11px;padding:2px 7px;border-radius:999px;letter-spacing:.06em}
.reset{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:6px}
.reset:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.progress{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:0 0 22px}
.progress button{height:8px;border:0;border-radius:999px;background:var(--line);cursor:pointer;padding:0}
.progress button.done{background:var(--good)}
.progress button.current{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.progress button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px 22px;box-shadow:0 12px 30px -20px rgba(11,27,43,.25)}
.step-n{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:Sora,'Plus Jakarta Sans',system-ui,sans-serif;font-size:28px;line-height:1.15;margin:0 0 10px;letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0 0 18px;font-size:17px;color:var(--ink)}
.time{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.hint{background:var(--ground);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted);margin:0 0 18px}
.hint b{color:var(--ink);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);flex:1 1 200px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn:focus-visible{outline:3px solid var(--accent-soft)}
.btn[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.choice{display:grid;gap:10px;margin:0 0 18px}
.choice label{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:15px}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice b{display:block;font-size:16px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted);font-size:14px}
.nav button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:8px 4px}
.nav button:disabled{color:var(--line);cursor:default}
.done-all{text-align:center}
.done-all .big{margin:6px auto 12px;width:84px;height:84px}
.done-all .big svg{width:84px;height:84px;display:block}
.ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin:0 0 12px}
.ico svg{width:26px;height:26px}
.btn svg{width:18px;height:18px;flex:none}
.nav button svg{width:16px;height:16px;vertical-align:-3px}
.summary .tick svg{width:12px;height:12px}
.dl{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 18px;color:var(--ink)}
.dl a{color:var(--accent);font-weight:700}
.summary{list-style:none;padding:0;margin:14px 0 0;text-align:left;display:grid;gap:8px}
.summary li{display:flex;gap:10px;align-items:center;font-size:15px}
.summary .tick{width:22px;height:22px;border-radius:50%;background:var(--good-soft);color:var(--good);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.summary .tick.no{background:var(--warn-soft);color:var(--warn-ink)}
.help{margin:22px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.help a{color:var(--accent);font-weight:700;text-decoration:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<body>
<div class="wrap">
<header>
  <a class="brand" href="https://foldpos.com/" style="color:inherit;text-decoration:none">Fold <span class="pill">POS</span>&nbsp;Store setup</a>
  <button class="reset" id="reset" type="button">Start over</button>
</header>
<nav class="progress" id="progress" aria-label="Steps"></nav>
<main class="card" id="card"></main>
<p class="help">Stuck? Email <a href="mailto:contact@foldpos.com?subject=Fold%20POS%20setup">contact@foldpos.com</a> and we'll do it with you.<br>Printer helper: <a href="https://foldpos.com/download">foldpos.com/download</a></p>
</div>
<script>
(function(){
  var POS = 'https://pos.foldpos.com';
  // Print helper downloads. Empty until hosting is live; the wizard then routes to Settings › Receipts.
  var DL = { win: 'https://foldpos.com/download/Fold-Print-Agent-Setup.exe', mac: '' };
  var I = {
    store:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10 5.2 5h13.6L20 10"/><path d="M4 10c0 1.4 1.1 2.5 2.5 2.5S9 11.4 9 10c0 1.4 1.1 2.5 2.5 2.5S14 11.4 14 10c0 1.4 1.1 2.5 2.5 2.5S19 11.4 19 10"/><path d="M5.5 12.5V20h13v-7.5"/><path d="M10 20v-4.5h4V20"/></svg>',
    browser:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9h18"/><circle cx="6.3" cy="6.8" r=".6" fill="currentColor"/><circle cx="8.6" cy="6.8" r=".6" fill="currentColor"/><path d="M8 14.5h8"/></svg>',
    tag:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5 12 4h8v8l-8.5 8.5a1.5 1.5 0 0 1-2.1 0l-5.9-5.9a1.5 1.5 0 0 1 0-2.1z"/><circle cx="15.5" cy="8.5" r="1.3"/></svg>',
    printer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V4h10v4"/><rect x="4" y="8" width="16" height="9" rx="2"/><path d="M7 14h10v6H7z"/><circle cx="17" cy="11.5" r=".7" fill="currentColor"/></svg>',
    team:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M15.5 14.3c2.8 0 5 1.8 5 4.7"/></svg>',
    text:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5z"/><path d="M8 9h8M8 12.5h5"/></svg>',
    ticket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16l-2.3-1.5L14.4 20l-2.4-1.5L9.6 20l-2.3-1.5L5 20z"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>',
    check:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.3 4.3L19 7.5"/></svg>',
    out:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M17 14v4.5H5.5v-11H10"/></svg>',
    down:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 19h14"/></svg>',
    left:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    right:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
    // finish: a hanger with a check (all done) or a basket with garments (steps left)
    party:  '<svg viewBox="0 0 84 84" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="42" cy="42" r="38" fill="var(--good-soft)" stroke="none"/><path d="M42 22a5 5 0 1 1 5 5c-3 0-5 2-5 5v3"/><path d="M42 35 14 52c-2 1.2-1.2 4 1.2 4h53.6c2.4 0 3.2-2.8 1.2-4z"/><path d="m33 47 6 6 12-12" stroke="var(--good)" stroke-width="4"/></svg>',
    basket: '<svg viewBox="0 0 84 84" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="42" cy="42" r="38" fill="var(--warn-soft)" stroke="none"/><path d="M18 38h48l-4 26H22z"/><path d="M18 38h48" /><path d="M30 38v-6a12 12 0 0 1 24 0v6"/><path d="M30 46v12M42 46v12M54 46v12"/></svg>'
  };
  var steps = [
    { key:'account', icon:'store', n:'Step 1 of 7', title:'Create your store account', time:'2 min',
      lead:'Pick your shop type, add your address, and you are in. No card needed — the first 14 days are free.',
      hint:'Use the email you check every day. Sign in from any computer at <b>pos.foldpos.com</b>.',
      link:{label:'Open Sign up', href:POS+'/signup'} },
    { key:'browser', icon:'browser', n:'Step 2 of 7', title:'Open Fold POS on the counter computer', time:'1 min',
      lead:'Fold POS runs in the browser — nothing to install. Chrome, Edge, Firefox and Safari all work. Bookmark it.',
      hint:'Chrome can print straight to the receipt printer. Edge, Firefox and Safari use the small <b>Fold print helper</b> instead — step 4 sets that up in two minutes.',
      link:{label:'Open pos.foldpos.com', href:POS+'/login'} },
    { key:'prices', icon:'tag', n:'Step 3 of 7', title:'Bring in your price list', time:'5–15 min',
      lead:'Import it from Cents, CleanCloud or a spreadsheet, or start from our ready-made list and change prices as you go.',
      hint:'Coming from another system? Export customers and prices there first, then <b>Settings › Import data</b>. You can undo an import.',
      link:{label:'Open Import data', href:POS+'/settings?section=import'},
      alt:{label:'Open Price List', href:POS+'/'} },
    { key:'printer', icon:'printer', n:'Step 4 of 7', title:'Connect your receipt printer', time:'2 min',
      lead:'Plug the printer into the computer by USB. Then pick the browser you use:',
      hint:'Works with Epson, Star and Bixolon receipt printers. Plug it in by USB and leave it at that — no need to add it in Windows or macOS settings.',
      choices:[
        {v:'chrome', b:'I use Chrome', t:'Settings › Receipts › Connect printer, pick it from the list, print a test page. On Windows, if the list is empty, install the print helper below instead.'},
        {v:'other',  b:'I use Edge, Firefox or Safari', t:'Install the Fold print helper: a small program that starts with the computer and prints whatever Fold POS sends. Run it, then type the pairing code from Settings › Receipts.'}
      ],
      link:{label:'Open Receipts settings', href:POS+'/settings?section=receipts'} },
    { key:'team', icon:'team', n:'Step 5 of 7', title:'Add your staff', time:'3 min',
      lead:'Give each person their own login so tickets show who rang them up. Staff can check in and check out; only you change prices and settings.',
      hint:'Employees is in the left menu. Keep the <b>Admin / Staff</b> toggle in mind on the login screen.',
      link:{label:'Open Fold POS', href:POS+'/'} },
    { key:'texts', icon:'text', n:'Step 6 of 7', title:'Customer texts', time:'1 min',
      lead:'Fold can text customers when an order is ready. It is on for you already — have a look at the wording and turn off anything you don’t want.',
      hint:'Texts go out from Fold’s number during the pilot. Your own store number comes later.',
      link:{label:'Open Customer texts', href:POS+'/settings?section=texts'} },
    { key:'first', icon:'ticket', n:'Step 7 of 7', title:'Ring up a real order', time:'2 min',
      lead:'Check in, type a customer, tap the garments, then Continue to checkout. The ticket prints. Then Check out to take payment when they collect.',
      hint:'Try the mic: press it and say <b>“two shirts and a suit for Maria, ready Thursday”</b>. That is Hey Fold.',
      link:{label:'Open Check in', href:POS+'/'} },
  ];

  var state = load();
  var idx = firstOpen();

  function load(){ try{ return JSON.parse(localStorage.getItem('fold-setup')||'{}') }catch(e){ return {} } }
  function save(){ try{ localStorage.setItem('fold-setup', JSON.stringify(state)) }catch(e){} }
  function firstOpen(){ for (var i=0;i<steps.length;i++){ if(!state[steps[i].key]) return i; } return steps.length; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function renderProgress(){
    var p = document.getElementById('progress'); p.innerHTML='';
    steps.forEach(function(s,i){
      var b=document.createElement('button'); b.type='button';
      b.className = (state[s.key]?'done':'') + (i===idx?' current':'');
      b.setAttribute('aria-label', s.title + (state[s.key]?' (done)':''));
      b.onclick=function(){ idx=i; render(); };
      p.appendChild(b);
    });
    var f=document.createElement('button'); f.type='button'; f.className=(idx===steps.length?'current':''); f.setAttribute('aria-label','Finish'); f.onclick=function(){ idx=steps.length; render(); }; p.appendChild(f);
  }

  function render(){
    renderProgress();
    var card=document.getElementById('card');
    if (idx>=steps.length){ renderFinish(card); return; }
    var s=steps[idx], done=!!state[s.key];
    var helper = '';
    if (s.key==='printer' && state['printer:choice']==='other'){
      var os = /Win/.test(navigator.platform||'') ? 'win' : /Mac/.test(navigator.platform||'') ? 'mac' : '';
      var href = os ? DL[os] : '';
      helper = '<div class="dl">'+(href
        ? '<b>Fold print helper for '+(os==='win'?'Windows':'Mac')+'</b> — download, open it, click through. It opens the pairing page when it finishes; type the code from Fold POS › Settings › Receipts. '
        : '<b>Fold print helper</b> — get it at <a href="https://foldpos.com/download" target="_blank" rel="noopener">foldpos.com/download</a>, run it, then type the pairing code from Fold POS › Settings › Receipts. ')+
        (os==='win' ? 'If Windows says “Windows protected your PC”, choose <b>More info › Run anyway</b>.' : '')+
        '</div>';
      if (href) s = Object.assign({}, s, { alt:{label:'Download the print helper', href:href, down:true} });
    }
    var choice = s.choices ? '<div class="choice">'+s.choices.map(function(c){
      var on = state[s.key+':choice']===c.v;
      return '<label><input type="radio" name="c-'+s.key+'" value="'+c.v+'"'+(on?' checked':'')+'><span><b>'+c.b+'</b>'+c.t+'</span></label>';
    }).join('')+'</div>' : '';
    card.innerHTML =
      '<div class="ico">'+I[s.icon]+'</div>'+
      '<p class="step-n">'+s.n+'</p>'+
      '<h1>'+s.title+'<span class="time">'+s.time+'</span></h1>'+
      '<p class="lead">'+s.lead+'</p>'+
      choice+helper+
      '<p class="hint">'+s.hint+'</p>'+
      '<div class="actions">'+
        '<a class="btn primary" target="_blank" rel="noopener" href="'+s.link.href+'">'+s.link.label+I.out+'</a>'+
        (s.alt?'<a class="btn" target="_blank" rel="noopener" href="'+s.alt.href+'">'+s.alt.label+(s.alt.down?I.down:I.out)+'</a>':'')+
        '<button class="btn good" type="button" id="done" aria-pressed="'+done+'">'+(done?I.check+'Done':'Mark done')+'</button>'+
      '</div>'+
      '<div class="nav"><button type="button" id="prev"'+(idx===0?' disabled':'')+'>'+I.left+' Back</button><span>'+(idx+1)+' / '+steps.length+'</span><button type="button" id="next">'+(done?'Next ':'Skip ')+I.right+'</button></div>';
    card.querySelectorAll('input[type=radio]').forEach(function(r){ r.onchange=function(){ state[s.key+':choice']=r.value; save(); render(); }; });
    document.getElementById('done').onclick=function(){ state[s.key]=!state[s.key]; save(); if(state[s.key]){ idx++; } render(); window.scrollTo({top:0,behavior:'smooth'}); };
    document.getElementById('prev').onclick=function(){ idx--; render(); };
    document.getElementById('next').onclick=function(){ idx++; render(); };
  }

  function renderFinish(card){
    var missing = steps.filter(function(s){ return !state[s.key]; });
    card.innerHTML =
      '<div class="done-all">'+
        '<div class="big">'+(missing.length?I.basket:I.party)+'</div>'+
        '<h1>'+(missing.length?'Almost there':'You’re open on Fold POS')+'</h1>'+
        '<p class="lead">'+(missing.length? missing.length+' step'+(missing.length>1?'s':'')+' left — tap one below to jump back.' : 'Every ticket, tag and text from here on runs through Fold. Welcome aboard.')+'</p>'+
        '<ul class="summary">'+steps.map(function(s,i){ return '<li><span class="tick '+(state[s.key]?'':'no')+'">'+(state[s.key]?I.check:'·')+'</span><a href="#" data-i="'+i+'" style="color:inherit;text-decoration:none">'+s.title+'</a></li>'; }).join('')+'</ul>'+
        '<div class="actions" style="margin-top:20px"><a class="btn primary" target="_blank" rel="noopener" href="'+POS+'/">Open Fold POS'+I.out+'</a></div>'+
      '</div>';
    card.querySelectorAll('a[data-i]').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); idx=+a.dataset.i; render(); }; });
  }

  document.getElementById('reset').onclick=function(){ if(!confirm('Clear your progress on this computer?')) return; state={}; save(); idx=0; render(); };
  render();
})();
</script>
</body>
</html>
