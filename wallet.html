<style>
:root{
  /* page */
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#eef2fa; --ink:#0f1830; --ink-2:#465373; --muted:#76819c;
  --line:#dfe5f1; --brand:#1e5eff; --brand-ink:#ffffff; --brand-soft:#e6edff; --focus:#1e5eff;
  --shadow-1:rgba(18,38,92,.08); --shadow-2:rgba(18,38,92,.16);
  /* illustration */
  --il-line:#c6d0e4; --il-fill:#edf1f9; --il-fill-2:#e3e9f5; --il-top:#f8faff; --il-tag:#ffffff; --il-ring:#1e5eff;
  /* device: phone page (light, as the real page) */
  --ph-bg:#fbfbfd; --ph-card:#ffffff; --ph-ink:#111114; --ph-muted:#6b6b76; --ph-line:#e6e6ec;
  --ph-brand:#2f5bea; --ph-ok:#12805c; --ph-bad:#c62828; --ph-meal:#8a4fff; --ph-rest:#0b7fa8;
  --ph-ok-soft:#dcefe8; --ph-meal-soft:#ece2ff; --ph-rest-soft:#d9edf4;
  --bezel:#0c0e13; --island:#000000;
  --msg-in:#e9e9eb; --msg-link:#0a63d6; --banner:#f2f2f5;
  /* device: POS (light, as the real app) */
  --pos-bg:#f7f8fa; --pos-surface:#ffffff; --pos-ink:#1a1d21; --pos-muted:#6b7280; --pos-line:#e5e7eb;
  --pos-muted-bg:#f3f4f6; --pos-brand:#1e5eff; --pos-brand-soft:#e8efff; --pos-rail:#ffffff;
  --ok-text:#007a14; --ok-bg:#eaffee; --ok-border:#abdcb8;
  --warn-text:#c75a17; --warn-bg:#fcf4ed; --warn-border:#ffd5bd;
  --info-text:#075985; --info-bg:#f0f9ff; --info-border:#bae6fd;
  --err-text:#e22d2d; --err-bg:#fcf1f1; --err-border:#ffc1c1;
  --scrim:rgba(17,24,39,.32); --cam-bg:#111216; --selfie-a:#dfe6f3; --selfie-b:#c3cee6; --selfie-p:#8796b4;
  --white:#ffffff; --black:#000000;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#141b2e; --surface-2:#1a2238; --ink:#eef2fb; --ink-2:#b7c1d9; --muted:#8a95af;
    --line:#26304a; --brand:#5b8cff; --brand-ink:#ffffff; --brand-soft:#1b2950; --focus:#7ea4ff;
    --shadow-1:rgba(0,0,0,.35); --shadow-2:rgba(0,0,0,.55);
    --il-line:#2c3756; --il-fill:#121a2d; --il-fill-2:#172038; --il-top:#1a2338; --il-tag:#f4f6fb; --il-ring:#7ea4ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#141b2e; --surface-2:#1a2238; --ink:#eef2fb; --ink-2:#b7c1d9; --muted:#8a95af;
  --line:#26304a; --brand:#5b8cff; --brand-ink:#ffffff; --brand-soft:#1b2950; --focus:#7ea4ff;
  --shadow-1:rgba(0,0,0,.35); --shadow-2:rgba(0,0,0,.55);
  --il-line:#2c3756; --il-fill:#121a2d; --il-fill-2:#172038; --il-top:#1a2338; --il-tag:#f4f6fb; --il-ring:#7ea4ff;
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100vh;height:100dvh;min-height:640px;display:grid;grid-template-rows:auto minmax(380px,1fr) auto}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 32px 6px}
.wm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.wm .mark{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.wm .mark svg{width:16px;height:16px}
.wm .sub{font-weight:500;color:var(--muted)}
.tools{display:flex;align-items:center;gap:10px}
.tgl{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:36px}
.tgl .sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .25s}
.tgl .sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .25s}
.tgl[aria-checked="true"] .sw{background:var(--brand)}
.tgl[aria-checked="true"] .sw::after{transform:translateX(14px)}
.seg2{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg2 button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:30px}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg2 .abbr{display:none}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden}
.canvas{position:absolute;left:0;top:0;width:1300px;height:660px;transform-origin:0 0;transition:transform .95s cubic-bezier(.45,0,.18,1)}
.illus{position:absolute;left:-600px;top:-170px;width:2500px;height:1000px;pointer-events:none}
.illus .g{transition:opacity .8s}
.canvas[data-scene="home"] .il-store{opacity:0}
.canvas:not([data-scene="home"]) .il-home{opacity:0}

/* ---------- phone ---------- */
.phone{position:absolute;left:900px;top:13px;width:317px;height:634px;border-radius:52px;background:var(--bezel);padding:9px;
  box-shadow:0 0 0 1.5px #2a2e38 inset,0 30px 60px -20px var(--shadow-2),0 12px 24px -12px var(--shadow-2);
  transition:transform .75s cubic-bezier(.45,0,.18,1),opacity .6s;z-index:3}
.phone.off{opacity:0;transform:translateX(60px) scale(.97);pointer-events:none}
.phone.tapping{transform:translate(64px,118px) rotate(11deg)}
.ph-scr{width:299px;height:616px;border-radius:43px;overflow:hidden;position:relative;background:var(--ph-bg)}
.ph-in{position:absolute;left:0;top:0;width:360px;height:742px;transform:scale(.83056);transform-origin:0 0;
  font:17px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ph-ink);background:var(--ph-bg)}
.ph-status{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font-weight:600;font-size:17px;z-index:6;color:var(--ph-ink);pointer-events:none}
.ph-status.dark{color:var(--white)}
.ph-status .ic{display:flex;gap:6px;align-items:center}
.ph-island{position:absolute;top:12px;left:50%;width:122px;height:36px;margin-left:-61px;border-radius:20px;background:var(--island);z-index:7}
.ph-views{position:absolute;inset:0}
.pv{position:absolute;inset:0;padding-top:54px;overflow:hidden;background:var(--ph-bg);transition:opacity .45s ease,transform .55s cubic-bezier(.3,0,.2,1)}
.pv.enter{opacity:0;transform:translateY(14px) scale(.985)}
.pv.leave{opacity:0;z-index:0}
.pv.dark{background:var(--cam-bg)}

/* the real page (clock.css), scoped */
.pv .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
.pv .brand{font-weight:700;letter-spacing:-.01em}
.pv .brand span{color:var(--ph-brand)}
.pv .store{color:var(--ph-muted);font-size:15px;text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv main{max-width:480px;margin:0 auto;padding:8px 16px 24px}
.pv .view{display:flex;flex-direction:column;gap:14px}
.pv .center{align-items:center;text-align:center;padding-top:88px}
.pv h1{font-size:28px;line-height:1.15;margin:8px 0 0;letter-spacing:-.02em;font-weight:700}
.pv p{margin:0}
.pv .muted{color:var(--ph-muted)}
.pv .small{font-size:14px}
.pv .card{background:var(--ph-card);border:1px solid var(--ph-line);border-radius:18px;padding:18px}
.pv .state{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--ph-line);font-size:15px;align-self:flex-start}
.pv .center .state{align-self:center}
.pv .state.in{background:var(--ph-ok-soft);color:var(--ph-ok)}
.pv .state.meal{background:var(--ph-meal-soft);color:var(--ph-meal)}
.pv .state.rest{background:var(--ph-rest-soft);color:var(--ph-rest)}
.pv .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.pv .btn{display:block;border:0;border-radius:16px;padding:18px;font-weight:650;font-size:19px;width:100%;text-align:center;transition:transform .15s,filter .15s}
.pv .primary{background:var(--ph-brand);color:var(--white)}
.pv .secondary{background:var(--ph-card);color:var(--ph-ink);border:1px solid var(--ph-line)}
.pv .meal-btn{background:var(--ph-meal);color:var(--white)}
.pv .rest-btn{background:var(--ph-rest);color:var(--white)}
.pv .link{background:none;color:var(--ph-brand);padding:8px;font-size:16px;font-weight:600;width:auto;display:inline-block}
.pv .big-check{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--ph-ok);color:var(--white);font-size:44px;line-height:1}
.pv .big-x{background:var(--ph-bad);font-weight:500}
.pv .pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.pv .time{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pv .code{font-size:32px;letter-spacing:.4em;text-align:center;width:100%;padding:14px;border-radius:14px;border:1px solid var(--ph-line);background:var(--ph-card);min-height:68px;display:flex;justify-content:center;align-items:center}
.pv .code.focus{border-color:#e0a106;box-shadow:0 0 0 1px #e0a106}
.pv .code .caret{width:2px;height:34px;background:var(--ph-brand);margin-left:-.3em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pv .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--ph-line);border-top-color:var(--ph-brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pv .note{font-size:14px;color:var(--ph-muted);border-top:1px solid var(--ph-line);padding-top:12px}
.pv .tabs{display:flex;gap:8px}
.pv .small-btn{padding:10px;font-size:15px;border-radius:12px}
.pv .totals{display:flex;justify-content:space-between;gap:8px;text-align:center}
.pv .totals div{display:flex;flex-direction:column;gap:2px;flex:1}
.pv .totals b{font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv .day{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pv .dayhead{display:flex;justify-content:space-between}
.pv .scrollvp{height:640px;overflow:hidden}
.pv .scroller{transition:transform 1.2s cubic-bezier(.45,0,.2,1)}
.pv .undo{display:flex;justify-content:center}
.pv .appr{opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s;align-self:flex-start}
.pv .appr.show{opacity:1;transform:none}

/* messages app */
.msg-h{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 12px;border-bottom:1px solid #e3e3e8;background:#f7f7f9;position:relative}
.msg-h .back{position:absolute;left:14px;top:22px;color:var(--msg-link);font-size:30px;line-height:1}
.msg-h .av{width:52px;height:52px;border-radius:50%;background:linear-gradient(#a4abb9,#868d9c);display:grid;place-items:center}
.msg-h .nm{font-size:14px;color:var(--ph-ink)}
.thread{padding:14px 14px;display:flex;flex-direction:column;gap:8px}
.ts{font-size:14px;color:#8a8a8e;text-align:center;margin:4px 0 6px}
.ts b{font-weight:600}
.bub{align-self:flex-start;max-width:82%;background:var(--msg-in);color:var(--ph-ink);border-radius:20px;padding:10px 14px;font-size:17px;line-height:1.32;word-break:break-word}
.bub a{color:var(--msg-link);text-decoration:underline}
.bub.drop{animation:drop .6s cubic-bezier(.25,1.3,.5,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-26px) scale(.92)}to{opacity:1;transform:none}}
.lnk{display:inline}
.banner{position:absolute;left:9px;right:9px;top:54px;z-index:8;background:var(--banner);border-radius:24px;padding:12px 14px 13px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:flex;gap:11px;
  transform:translateY(-170%);opacity:0;transition:transform .6s cubic-bezier(.25,1.2,.45,1),opacity .35s}
.banner.show{transform:none;opacity:1}
.banner .appic{width:38px;height:38px;border-radius:9px;background:linear-gradient(#5df46f,#16c52f);flex:none;display:grid;place-items:center}
.banner .bt{display:flex;justify-content:space-between;font-size:15px;font-weight:650}
.banner .bt span{font-weight:400;color:#7c7c82;font-size:14px}
.banner .bb{font-size:15px;line-height:1.3;margin-top:2px}
.camui{position:absolute;inset:0;background:var(--cam-bg);display:flex;flex-direction:column;align-items:center}
.camui .vf{margin-top:96px;width:330px;height:440px;border-radius:6px;overflow:hidden;position:relative}
.camui .shutter{margin-top:58px;width:76px;height:76px;border-radius:50%;border:5px solid var(--white);display:grid;place-items:center;transition:transform .15s}
.camui .shutter i{width:58px;height:58px;border-radius:50%;background:var(--white);display:block}
.camui .flash{position:absolute;inset:0;background:var(--white);opacity:0;pointer-events:none}
.camui .flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

/* ---------- POS window ---------- */
.pos{position:absolute;left:30px;top:30px;width:800px;height:600px;border-radius:16px;background:var(--pos-bg);overflow:hidden;
  box-shadow:0 0 0 1px rgba(15,24,48,.08),0 30px 60px -24px var(--shadow-2),0 10px 22px -12px var(--shadow-1);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--pos-ink);font-size:14px;
  display:grid;grid-template-columns:60px 1fr;container-type:inline-size;transition:opacity .6s,transform .75s cubic-bezier(.45,0,.18,1);z-index:2}
.m .pos{width:440px;grid-template-columns:1fr}
.m .pos .rail{display:none}
.pos.off{opacity:0;transform:translateX(-50px) scale(.98);pointer-events:none}
.rail{background:var(--pos-rail);border-right:1px solid var(--pos-line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.rail .lg{width:34px;height:34px;border-radius:10px;background:var(--pos-brand);display:grid;place-items:center;margin-bottom:10px}
.rail .ri{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#8a93a3}
.rail .ri.on{background:var(--pos-brand-soft);color:var(--pos-brand)}
.rail svg{width:20px;height:20px}
.pmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.ptop{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px}
.ptitle{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pstore{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--pos-muted);font-weight:500}
.pstore .av{width:28px;height:28px;border-radius:50%;background:var(--pos-brand-soft);color:var(--pos-brand);display:grid;place-items:center;font-size:12px;font-weight:700}
.psegs{padding:8px 20px 0;display:flex;flex-direction:column;gap:10px}
.pseg{display:inline-flex;align-self:flex-start;background:var(--pos-muted-bg);border:1px solid var(--pos-line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow:hidden;white-space:nowrap}
.pseg span{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--pos-muted);flex:none}
.pseg span.on{background:var(--pos-surface);color:var(--pos-ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pbody{flex:1;min-height:0;overflow:hidden;position:relative;padding:14px 20px 20px}
.pscroll{transition:transform 1s cubic-bezier(.45,0,.2,1)}
.pfade{animation:pfade .5s ease both}
@keyframes pfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pcard{background:var(--pos-surface);border:1px solid var(--pos-line);border-radius:14px;padding:16px 18px}
.pcard-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pcard-h h3{margin:0;font-size:16px;font-weight:650}
.pact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;transition:transform .15s,filter .15s,background .3s,color .3s}
.pb svg{width:15px;height:15px}
.pb.fill{background:var(--pos-brand);color:var(--white)}
.pb.out{background:var(--pos-surface);border-color:var(--pos-line);color:var(--pos-ink)}
.pb.txt{background:none;color:var(--pos-brand);padding:6px 8px}
.pmuted{color:var(--pos-muted);font-size:12px}
.plabel{font-size:12px;font-weight:600;color:var(--pos-ink)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--pos-line)}
.prow:first-of-type{border-top:0}
.pname{font-weight:600;font-size:14px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.pill.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-text)}
.pill.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}
.pill.info{background:var(--info-bg);border-color:var(--info-border);color:var(--info-text)}
.pill.mute{background:var(--pos-muted-bg);border-color:var(--pos-line);color:var(--pos-muted)}
.pill.err{background:var(--err-bg);border-color:var(--err-border);color:var(--err-text)}
.fact{display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .fl{font-size:12px;color:var(--pos-muted)}
.fact .fv{font-size:13px;font-variant-numeric:tabular-nums;font-weight:500}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px}
.who{display:grid;grid-template-columns:3fr 4fr 2fr 2fr 96px;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--pos-line)}
.who:first-child{border-top:0}
.who .stw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slidein{animation:slidein .55s cubic-bezier(.3,0,.2,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.hl{position:relative}
.hl::before{content:"";position:absolute;inset:-4px -10px;border-radius:10px;background:var(--pos-brand-soft);z-index:-1;opacity:0;transition:opacity .5s}
.hl.on::before{opacity:1}
.swrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--pos-line)}
.swrow:first-child{border-top:0}
.swrow .t{font-size:14px;font-weight:500}

/* container: narrow POS (the app's own narrow layout) */

/* ---------- pointer, ripple, callouts ---------- */
.pressed{transform:scale(.97);filter:brightness(.9)}
#finger{position:absolute;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(30,94,255,.65);
  box-shadow:0 6px 16px rgba(10,20,50,.25);opacity:0;z-index:20;pointer-events:none;transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),opacity .3s,transform .16s}
#finger.on{opacity:1}
#finger.down{transform:scale(.78);background:rgba(30,94,255,.3)}
#finger::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(30,94,255,.6);opacity:0}
#finger.down::after{animation:fr .6s ease-out}
@keyframes fr{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
#ripple{position:absolute;left:1262px;top:470px;width:0;height:0;z-index:15;pointer-events:none}
#ripple i{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;border:3px solid var(--il-ring);opacity:0}
#ripple.go i{animation:rip 1.5s cubic-bezier(.2,.6,.3,1) forwards}
#ripple.go i:nth-child(2){animation-delay:.22s}
#ripple.go i:nth-child(3){animation-delay:.44s}
@keyframes rip{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
.co{position:absolute;z-index:12;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600;line-height:1.3;
  box-shadow:0 10px 24px -8px var(--shadow-2);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;max-width:280px}
.co.show{opacity:1;transform:none}
.co .k{display:block;font-size:12px;font-weight:600;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}

/* ---------- caption & controls ---------- */
.cap{width:100%;max-width:1200px;margin:0 auto;padding:10px 32px 22px}
.caprow{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
.captext{min-height:106px;transition:opacity .35s}
.captext.fade{opacity:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--brand);letter-spacing:.02em}
.ctitle{font-size:27px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px;transition:opacity .4s}
.csent{font-size:17px;line-height:1.5;color:var(--ink-2);max-width:760px;margin:0}
.capchips{display:none;flex-wrap:wrap;gap:6px;margin-top:8px}
.capchips span{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.ctrls{display:flex;gap:10px;align-items:center;flex:none;padding-bottom:6px}
.cb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.cb svg{width:18px;height:18px}
.cb.play{width:56px;height:56px;background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cb.play svg{width:22px;height:22px}
.cb:disabled{opacity:.4;cursor:default}
.steps{list-style:none;display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin:16px 0 0;padding:0}
.steps button{width:100%;border:0;background:none;padding:6px 0 0;text-align:left;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:7px}
.steps .bar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.steps .bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:2px}
.steps .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .lb b{font-weight:600;margin-right:4px}
.steps button[aria-current="step"]{color:var(--ink)}
.steps button.done .bar i{width:100%}

/* ---------- phone-width page ---------- */
@media (max-width:700px){
  .app{height:auto;min-height:0;grid-template-rows:auto auto auto}
  .hdr{padding:10px 16px 2px}
  .wm{font-size:16px;gap:8px}
  .wm .sub{display:none}
  .seg2 .full{display:none}
  .seg2 .abbr{display:inline}
  .tools{gap:6px}
  .tgl{font-size:13px;padding:4px 10px 4px 5px;min-height:34px}
  .seg2 button{padding:5px 10px;font-size:13px}
  .stage{height:min(510px,60vh);min-height:420px}
  .cap{padding:6px 16px 18px}
  .caprow{flex-direction:column;align-items:stretch;gap:12px}
  .captext{min-height:0}
  .ctitle{font-size:22px}
  .csent{font-size:16px}
  .capchips{display:flex}
  .co{display:none}
  .ctrls{justify-content:center;padding:0}
  .cb{width:42px;height:42px}
  .cb.play{width:50px;height:50px}
  .steps{gap:4px;margin-top:12px}
  .steps button{align-items:center;padding:10px 0;min-height:30px}
  .steps .lb{display:none}
  .steps .bar{width:100%}
}

/* ---------- motion ---------- */
.instant, .instant *, .instant *::before, .instant *::after{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  .pv .spinner,.pv .code .caret{animation:none!important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* POS additions */
.chips2{display:flex;gap:8px;flex-wrap:wrap}
.amt{border:1px solid #cfd4dc;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;background:var(--pos-surface);transition:background .3s,color .3s,border-color .3s,transform .15s;font-variant-numeric:tabular-nums}
.amt.sel{background:var(--pos-brand);border-color:var(--pos-brand);color:var(--white)}
.amt.fixed{background:var(--pos-brand-soft);border-color:var(--pos-brand);color:var(--pos-brand)}
.brk{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--pos-brand-soft);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pnote{font-size:12px;color:var(--pos-muted);margin-top:8px;line-height:1.45}
.wbal{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 4px;flex-wrap:wrap}
.wbal .v{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .4s}
.wbal .v.up{color:var(--ok-text)}
.subh{font-size:12px;font-weight:600;color:var(--pos-muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px}
.erow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--pos-line);font-size:13px;align-items:center}
.erow:first-of-type{border-top:0}
.erow .amtv{font-weight:600;font-variant-numeric:tabular-nums}
.erow .amtv.p{color:var(--ok-text)}
.okbar{display:flex;align-items:center;gap:8px;border:1px solid var(--ok-border);background:var(--ok-bg);color:var(--ok-text);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
.waitbar{display:flex;align-items:center;gap:10px;border:1px solid var(--info-border);background:var(--info-bg);color:var(--info-text);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:12px}
.waitbar i{width:16px;height:16px;border-radius:50%;border:2px solid var(--info-border);border-top-color:var(--info-text);animation:spin .9s linear infinite;flex:none}
.cust{display:flex;align-items:center;gap:12px}
.cust .av{width:40px;height:40px;border-radius:50%;background:var(--pos-brand-soft);color:var(--pos-brand);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:1px solid var(--pos-line);border-radius:12px;padding:12px 14px;background:var(--pos-surface)}
.stat .sl{font-size:12px;color:var(--pos-muted);font-weight:500}
.stat .sv{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .ss{font-size:12px;color:var(--pos-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.stat.hero{background:var(--pos-brand-soft);border-color:transparent}
.search{border:1px solid #cfd4dc;border-radius:10px;padding:10px 12px;font-size:14px;display:flex;align-items:center;gap:8px;background:var(--pos-surface)}
.search .caret{width:2px;height:18px;background:var(--pos-brand);animation:blink 1s steps(1) infinite}
.tenders{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.ten{border:1px solid #cfd4dc;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;background:var(--pos-surface);transition:background .3s,color .3s,border-color .3s,transform .15s}
.ten.sel{background:var(--pos-brand-soft);border-color:var(--pos-brand);color:var(--pos-brand)}


a.wm{color:inherit;text-decoration:none}

  $('hdrSub').textContent = u('sub');
  $('bBack').setAttribute('aria-label', u('back'));
  $('bNext').setAttribute('aria-label', u('next'));
  $('lenEn').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
  $('lenEs').setAttribute('aria-pressed', lang === 'es' ? 'true' : 'false');
  $('devApple').setAttribute('aria-pressed', dev === 'apple' ? 'true' : 'false');
  $('devGoogle').setAttribute('aria-pressed', dev === 'google' ? 'true' : 'false');
  renderPlay();
}
function setLang(l){ lang = l; renderChrome(); go(idx); }
function setDev(d){ dev = d; renderChrome(); go(idx); }

$('bPlay').addEventListener('click', function(){ playing ? pause() : play(); });
$('bBack').addEventListener('click', function(){ go(idx - 1); });
$('bNext').addEventListener('click', function(){ go(idx + 1); });
$('lenEn').addEventListener('click', function(){ setLang('en'); });
$('lenEs').addEventListener('click', function(){ setLang('es'); });
$('devApple').addEventListener('click', function(){ setDev('apple'); });
$('devGoogle').addEventListener('click', function(){ setDev('google'); });
document.addEventListener('keydown', function(e){
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  var tag = (e.target && e.target.tagName) || '';
  if (e.key === 'ArrowRight'){ e.preventDefault(); if (idx < STEPS.length - 1) go(idx + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); if (idx > 0) go(idx - 1); }
  else if ((e.key === ' ' || e.key === 'Spacebar') && tag !== 'BUTTON' && tag !== 'INPUT'){ e.preventDefault(); playing ? pause() : play(); }
});
var rz;
window.addEventListener('resize', function(){ clearTimeout(rz); canvas.style.transition = 'none'; applyCam(); rz = setTimeout(function(){ canvas.style.transition = ''; }, 60); });

/* For reviewers and screenshots: FoldWallet.show(step, {lang, dev}) shows a step's finished frame. */
window.FoldWallet = {
  show:function(i, o){ o = o || {}; if (o.lang) lang = o.lang; if (o.dev) dev = o.dev; playing = false; renderChrome(); load(i, 'final'); renderPlay(); },
  play:function(){ play(); }, pause:function(){ pause(); }, steps:STEPS.length
};

ripple.style.left = '1055px'; ripple.style.top = '236px';
canvas.style.transition = 'none';
renderChrome(); applyCam(); load(0, 'cut');
requestAnimationFrame(function(){ canvas.style.transition = ''; });
if (!reduced){ playing = true; renderPlay(); } else { load(0, 'final'); renderPlay(); }
requestAnimationFrame(tick);
})();
</script>
